spring.application.name=movies-api

# --- SQLite datasource ---
# The database file is created in the project root on first run.
spring.datasource.url=jdbc:sqlite:movies.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- JPA / Hibernate ---
# SQLite is not supported by core Hibernate; this dialect comes from
# the hibernate-community-dialects dependency.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pretty-print JSON responses (nicer when testing in Postman/browser).
spring.jackson.serialization.indent-output=true

# Sensible pagination defaults / guardrails.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
